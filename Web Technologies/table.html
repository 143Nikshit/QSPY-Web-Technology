<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
            * {
                font-family: Arial, sans-serif;
            }
            table{
                width: 60%;
                margin: 50px auto;
                border-collapse: collapse;
                text-align: center;
                font-family: Arial, sans-serif;

            }

            th, td{
                border: 2px solid black;
                padding: 10px;
            }
            th{
                background-color: lightblue;
            }

        </style>
</head>
<body>
    <script>
        //create table
        let table = document.createElement("table");

        //create table header row
        let tr1 = document.createElement("tr");

        let th1 = document.createElement("th");
        th1.innerText = "Name";

        let th2 = document.createElement("th");
        th2.innerText = "Age";

        let th3 = document.createElement("th");
        th3.innerText = "Course";

        tr1.appendChild(th1);
        tr1.appendChild(th2);
        tr1.appendChild(th3);
        
        table.appendChild(tr1);

        //student data
        let students = [
            {name: "Ram", age: 22, course: "ReactJs"},
            {name: "laxman", age: 20, course: "Angular"},
            {name: "Sita", age: 21, course: "VueJs"}
        ];

        //create row dynamically
        for(let i = 0; i < students.length; i++){
            let tr = document.createElement("tr");

            let td1 = document.createElement("td");
            td1.innerText = students[i].name;

            let td2 = document.createElement("td");
            td2.innerText = students[i].age;

            let td3 = document.createElement("td");
            td3.innerText = students[i].course;

            tr.appendChild(td1);
            tr.appendChild(td2);
            tr.appendChild(td3);

            table.appendChild(tr);
        }

        //append table into body
        document.body.appendChild(table);
    </script>


</body>
</html>
